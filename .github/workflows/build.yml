name: build feeds

on:
  schedule:
    - cron: '7,37 * * * *' # every 30 min (GitHub may run it a few minutes late)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # keepalive below

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build.mjs
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - run: cp README.md out/README.md && cp sources.json out/sources.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub turns off scheduled workflows after 60 days without repo activity. Re-enable monthly.
      - if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0100" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
